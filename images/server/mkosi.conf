[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
Output=sc-linux
ImageId=sc-linux
CompressOutput=no
ManifestFormat=json
SplitArtifacts=uki

[Content]
# One package per line: mkosi does not split a specification on spaces.
Packages=linux-image-amd64
         systemd-sysv
         systemd-boot-efi
         systemd-resolved
         systemd-timesyncd
         udev
         kmod
         dbus
         freeipa-client
         sssd-ipa
         sssd-tools
         libnss-sss
         libpam-sss
         krb5-user
         openssh-server
         openssh-client
         sudo
         cloud-init
         python3
         ca-certificates
         openssl
         tpm2-tools
         curl
         iproute2
         procps
         util-linux
         less
         apparmor
Bootable=yes
Bootloader=uki
KernelCommandLine=root=PARTUUID rw console=tty0 console=ttyS0,115200n8
# Generated by scripts/prepare.py; never edit build/ by hand.
ExtraTrees=../../build/server-overlay
WithRecommends=no
WithDocs=yes
CleanPackageMetadata=no

[Build]
SandboxTrees=../../build/sandbox
Incremental=no
WithNetwork=no

[Validation]
# Local signing is an explicit build option; CI produces unsigned images.
SecureBoot=no
SecureBootAutoEnroll=no
SignExpectedPcr=no
Checksum=yes
