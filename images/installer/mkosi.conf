[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=uki
Output=sc-linux-installer
ImageId=sc-linux-installer
ManifestFormat=json

[Content]
# One package per line: mkosi does not split a specification on spaces.
Packages=linux-image-amd64
         systemd-sysv
         systemd-boot-efi
         udev
         kmod
         bash
         coreutils
         util-linux
         mount
         python3
         zstd
         gdisk
         procps
Bootable=yes
Bootloader=uki
MakeInitrd=yes
KernelCommandLine=rd.systemd.unit=scos-installer.target console=tty0 console=ttyS0,115200n8
# Generated by notebooks/prepare.ipynb; never edit build/ by hand.
ExtraTrees=../../build/installer-overlay
WithRecommends=no
WithDocs=no

[Build]
SandboxTrees=../../build/sandbox
Incremental=no
WithNetwork=no

[Validation]
# Local signing is an explicit build option; CI produces unsigned images.
SecureBoot=no
SecureBootAutoEnroll=no
SignExpectedPcr=no
Checksum=yes
